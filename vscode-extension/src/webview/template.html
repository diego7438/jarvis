<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src {{CSP_SOURCE}}; style-src 'unsafe-inline' {{CSP_SOURCE}}; connect-src http://127.0.0.1:8080;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>
    <link rel="stylesheet" href="{STYLES_URI}">

</head>
<body>
    <div id="header">
        <div class = "arc-reactor"></div>
        <div>
            <h1>J.A.R.V.I.S.</h1>
            <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
        </div>
    </div>

    <div id="messages">
        <div class="message assistant">
            <div class="role-label">JARVIS</div>
            Good day sir. I am online and awaiting your command.
            Highlight any code in your editor and right-click to consult me.
        </div>
    </div>

    <div id="thinking-row">
        <div id="thinking">
            <span class="thinking-dots"><span></span><span></span><span></span></span>
            ⬡ PROCESSING...
            <button id="stopBtn">STOP</button>
        </div>
    </div>

    <div id="input-area">
        <div id="input-wrapper">
            <textarea
                id="userInput"
                placeholder="Ask JARVIS anything, sir..."
                rows="3"
            ></textarea>
            <div id="tokenCounter">0 tokens</div>
        </div>
        <button id="sendBtn">SEND</button>
    </div>

    <div id="footer">
        🔒 100% LOCAL · ZERO DATA TRANSMISSION · METAL GPU ACCELERATED
    </div>

    <script src="{{MARKED_URI}}"></script>
    <script src="{{MAIN_URI}}"></script>
</body>
</html>
